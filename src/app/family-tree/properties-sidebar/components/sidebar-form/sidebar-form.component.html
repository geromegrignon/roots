<div class="form-section">
  <span class="h10 section-title">Person</span>

  <div class="section-content">
    <app-form-field label="First Name" fieldId="firstName">
      <input
        id="firstName"
        pInputText
        fluid
        type="text"
        class="p10"
        [formField]="fieldTree.firstName"
        [appAutofocus]="nodeId()"
        placeholder="Enter first name"
      />
    </app-form-field>

    <app-form-field label="Last Name" fieldId="lastName">
      <input
        id="lastName"
        pInputText
        fluid
        type="text"
        class="p10"
        [formField]="fieldTree.lastName"
        placeholder="Enter last name"
      />
    </app-form-field>

    <app-form-field label="Gender" fieldId="gender">
      <p-select
        inputId="gender"
        [formField]="$any(fieldTree.gender)"
        [options]="genderOptions()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [fluid]="true"
        placeholder="Select a gender"
      />
    </app-form-field>

    <app-form-field label="Birth Year" fieldId="birthYear">
      <p-inputnumber
        inputId="birthYear"
        [formField]="$any(fieldTree.birthYear)"
        [useGrouping]="false"
        [fluid]="true"
        placeholder="e.g. 1970"
      />
    </app-form-field>

    <app-form-field label="Death Year" fieldId="deathYear">
      <p-inputnumber
        inputId="deathYear"
        [formField]="$any(fieldTree.deathYear)"
        [useGrouping]="false"
        [fluid]="true"
        placeholder="e.g. 2020"
      />
    </app-form-field>
  </div>
</div>

<div class="form-separator"></div>

<div class="form-section">
  <span class="h10 section-title">Spouse</span>

  <div class="section-content">
    <app-form-field label="Spouse First Name" fieldId="spouseFirstName">
      <input
        id="spouseFirstName"
        pInputText
        fluid
        type="text"
        class="p10"
        [formField]="fieldTree.spouseFirstName"
        placeholder="Enter spouse's first name"
      />
    </app-form-field>

    <app-form-field label="Spouse Last Name" fieldId="spouseLastName">
      <input
        id="spouseLastName"
        pInputText
        fluid
        type="text"
        class="p10"
        [formField]="fieldTree.spouseLastName"
        placeholder="Enter spouse's last name"
      />
    </app-form-field>

    <app-form-field label="Spouse Gender" fieldId="spouseGender">
      <p-select
        inputId="spouseGender"
        [formField]="$any(fieldTree.spouseGender)"
        [options]="genderOptions()"
        optionLabel="label"
        optionValue="value"
        [showClear]="true"
        [fluid]="true"
        placeholder="Select a gender"
      />
    </app-form-field>

    <app-form-field label="Spouse Birth Year" fieldId="spouseBirthYear">
      <p-inputnumber
        inputId="spouseBirthYear"
        [formField]="$any(fieldTree.spouseBirthYear)"
        [useGrouping]="false"
        [fluid]="true"
        placeholder="e.g. 1972"
      />
    </app-form-field>

    <app-form-field label="Spouse Death Year" fieldId="spouseDeathYear">
      <p-inputnumber
        inputId="spouseDeathYear"
        [formField]="$any(fieldTree.spouseDeathYear)"
        [useGrouping]="false"
        [fluid]="true"
        placeholder="e.g. 2021"
      />
    </app-form-field>
  </div>
</div>

<div class="form-separator"></div>

<div class="form-section">
  <span class="h10 section-title">Family Structure</span>

  <div class="section-content">
    <app-form-field label="Parent" fieldId="parentId">
      <app-parent-field
        triggerId="parentId"
        [candidateNodes]="parentCandidateNodes()"
        [formField]="fieldTree.parentId"
      />
    </app-form-field>
  </div>
</div>
