<div class="node" [style.--node-accent]="color()">
  <app-node-header [fullName]="fullName()" [subtitle]="lifespan()" [gender]="gender()" />

  @if (spouseFirstName()) {
    <div class="spouse-divider"></div>
    <app-node-header
      class="spouse"
      [fullName]="spouseFullName()"
      [subtitle]="spouseLifespan()"
      [gender]="spouseGender()"
      avatarSize="md"
    />
  }
</div>
