<div class="sidebar-header">
  <span id="properties-sidebar-title" class="h7 sidebar-title">Properties</span>
  <div class="sidebar-header-actions">
    @if (showCommunityCvButton()) {
      <button
        class="sidebar-toggle cv-toggle"
        type="button"
        (click)="communityCvToggle.emit()"
        aria-label="View Gérôme Grignon's Angular community CV"
      >
        <span class="icon icon-star"></span>
      </button>
    }
    <button
      class="sidebar-toggle"
      (click)="toggle.emit()"
      [attr.aria-expanded]="isExpanded()"
      aria-label="Toggle properties panel"
    >
      <span class="icon icon-sidebar"></span>
    </button>
  </div>
</div>
