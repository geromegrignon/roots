@if (isOpen()) {
  <div class="modal-overlay" (click)="onOverlayClick($event)" (keydown.escape)="close()">
    <div
      class="modal-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="add-family-tree-title"
    >
      <div class="modal-header">
        <span id="add-family-tree-title" class="h7">New family tree</span>
        <button type="button" class="modal-close" aria-label="Close" (click)="close()">
          <span aria-hidden="true">✕</span>
        </button>
      </div>

      <form (submit)="onSubmit($event)">
        <app-form-field label="Family tree name" fieldId="new-family-tree-name">
          <input
            id="new-family-tree-name"
            type="text"
            class="text-input p10"
            [value]="name()"
            (input)="onNameInput($event)"
            [appAutofocus]="isOpen()"
            placeholder="e.g. Grignon"
            autocomplete="off"
            required
          />
        </app-form-field>

        <div class="modal-actions">
          <button type="button" class="btn btn-secondary" (click)="close()">Cancel</button>
          <button type="submit" class="btn btn-primary" [disabled]="!name().trim()">Create</button>
        </div>
      </form>
    </div>
  </div>
}
