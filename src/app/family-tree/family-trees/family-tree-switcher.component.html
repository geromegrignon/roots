<div class="tree-switcher">
  <span class="icon icon-tree" aria-hidden="true"></span>
  <p-select
    [ngModel]="store.activeTreeId()"
    (ngModelChange)="onChange($event)"
    [options]="treeOptions()"
    optionLabel="label"
    optionValue="value"
    ariaLabel="Switch family tree"
    [fluid]="true"
  />
  @if (canDeleteActiveTree()) {
    <button
      type="button"
      class="delete-tree-button"
      aria-label="Delete family tree"
      (click)="onDeleteActiveTree()"
    >
      <span class="icon icon-delete" aria-hidden="true"></span>
    </button>
  }
</div>

<app-add-family-tree-modal [isOpen]="isAddModalOpen()" (closed)="closeAddModal()" />
