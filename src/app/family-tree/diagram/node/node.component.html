@switch (variant()) {
  @case ('vacant') {
    <app-vacant-node />
  }
  @case ('compact') {
    @let data = occupiedData();
    <app-compact-node
      [firstName]="data?.firstName"
      [lastName]="data?.lastName"
      [gender]="data?.gender"
      [birthYear]="data?.birthYear"
      [deathYear]="data?.deathYear"
      [color]="color()"
      [spouseFirstName]="data?.spouseFirstName"
      [spouseLastName]="data?.spouseLastName"
      [spouseGender]="data?.spouseGender"
      [spouseBirthYear]="data?.spouseBirthYear"
      [spouseDeathYear]="data?.spouseDeathYear"
      [spouseColor]="spouseColor()"
    />
  }
  @case ('full') {
    @let data = occupiedData();
    <app-full-node
      [firstName]="data?.firstName"
      [lastName]="data?.lastName"
      [gender]="data?.gender"
      [birthYear]="data?.birthYear"
      [deathYear]="data?.deathYear"
      [color]="color()"
      [spouseFirstName]="data?.spouseFirstName"
      [spouseLastName]="data?.spouseLastName"
      [spouseGender]="data?.spouseGender"
      [spouseBirthYear]="data?.spouseBirthYear"
      [spouseDeathYear]="data?.spouseDeathYear"
      [spouseColor]="spouseColor()"
    />
  }
}

<app-toggle-expand-button [node]="node()" [isHorizontal]="isHorizontal()" />

@if (isInDropRange()) {
  <app-drop-indicator [nodeId]="nodeId()" side="left" />
  <app-drop-indicator [nodeId]="nodeId()" side="right" />
  <app-drop-indicator [nodeId]="nodeId()" side="bottom" [hasChildren]="hasChildren()" />
}

@if (showAddButtons()) {
  @if (!isRoot()) {
    <app-add-button [nodeId]="nodeId()" position="left" />
    <app-add-button [nodeId]="nodeId()" position="right" />
  }
  <app-add-button [nodeId]="nodeId()" position="bottom" />
}

@if (isNodeHovered()) {
  <div class="hover-zone" data-no-drag="true"></div>
}

<!-- Connection ports: incoming edge port and outgoing edge port. -->
<ng-diagram-port id="port-in" type="both" [side]="isHorizontal() ? 'left' : 'top'" />
<ng-diagram-port id="port-out" type="both" [side]="isHorizontal() ? 'right' : 'bottom'" />
